<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Налаштування — alert_desktop</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1 class="settings-title">Налаштування</h1>
      <p class="settings-subtitle">Параметри моніторингу та сповіщень про тривоги</p>
    </header>

    <main class="settings-body">
      <!-- Розділ вибору місцевості -->
      <section class="settings-group">
        <label for="locationSelect" class="group-label">Місцевість для моніторингу</label>
        <div class="select-wrapper">
          <select id="locationSelect" class="form-select">
            <option value="" disabled selected>Оберіть область або місто...</option>
          </select>
        </div>
        <p class="field-hint">Статус тривоги у системному треї оновлюватиметься для обраного регіону.</p>
      </section>

      <!-- Розділ звукових сповіщень -->
      <section class="settings-group">
        <span class="group-label">Звуковий сигнал</span>
        
        <div class="checkbox-control">
          <input type="checkbox" id="chkSoundEnabled" class="form-checkbox">
          <label for="chkSoundEnabled" class="checkbox-label">Увімкнути звуковий сигнал при тривозі</label>
        </div>

        <div id="soundControls" class="sound-subcontrols disabled">
          <div class="volume-row">
            <span class="control-icon" aria-hidden="true">
              <!-- Linear Volume Icon -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </span>
            <input type="range" id="volumeSlider" class="form-range" min="0" max="100" value="80" disabled>
            <span id="volumeValue" class="volume-val">80%</span>
          </div>

          <div class="test-audio-row">
            <button type="button" id="btnPlayTest" class="btn-secondary btn-test-audio" disabled>
              <span id="playIcon" class="btn-icon-inner">
                <!-- Linear Play Icon -->
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
              </span>
              <span id="playText">Перевірити звук</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Розділ системи -->
      <section class="settings-group">
        <span class="group-label">Система</span>
        <div class="checkbox-control">
          <input type="checkbox" id="chkAutoStart" class="form-checkbox">
          <label for="chkAutoStart" class="checkbox-label">Запускати при старті системи</label>
        </div>
      </section>

      <!-- Розділ сервера та ретранслятора -->
      <section class="settings-group">
        <span class="group-label">Сервер та API</span>
        <div class="form-field">
          <label for="inputServerUrl" class="field-label">URL сервера або ретранслятора</label>
          <input type="url" id="inputServerUrl" class="form-input" placeholder="https://devs.alerts.in.ua/api/v1/alerts/active.json">
        </div>
        <div class="form-field">
          <label for="inputApiKey" class="field-label">API ключ (опціонально)</label>
          <input type="password" id="inputApiKey" class="form-input" placeholder="Ключ для devs.alerts.in.ua">
        </div>
      </section>
    </main>

    <footer class="settings-footer">
      <button type="button" id="btnCancel" class="btn-secondary">Скасувати</button>
      <button type="button" id="btnSave" class="btn-primary">Зберегти</button>
    </footer>
  </div>

  <audio id="audioTest" src="../../../assets/audio/alert.wav" preload="auto"></audio>

  <script src="settings.js"></script>
</body>
</html>
