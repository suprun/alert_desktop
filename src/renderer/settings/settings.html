<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Налаштування — Повітряні тривоги</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1 class="settings-title">Налаштування</h1>
      <p class="settings-subtitle">Параметри моніторингу та сповіщень про тривоги</p>
    </header>

    <main class="settings-body">
      <!-- Розділ вибору місцевості з пошуком -->
      <section class="settings-group">
        <label for="locationSearchInput" class="group-label">Місцевість для моніторингу</label>
        <div class="combobox-wrapper" id="comboboxWrapper">
          <div class="search-input-container">
            <span class="search-icon" aria-hidden="true">
              <!-- Linear search SVG icon -->
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="locationSearchInput" 
              class="form-input search-input" 
              placeholder="Почніть вводити назву міста, району чи громади..." 
              autocomplete="off"
            >
            <button type="button" id="btnClearLocation" class="btn-clear" title="Очистити поле" style="display: none;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>

          <!-- Випадаючий список результатів пошуку -->
          <div id="locationDropdown" class="combobox-dropdown" style="display: none;">
            <div id="locationList" class="location-list"></div>
            <div id="locationNoResults" class="location-no-results" style="display: none;">
              Нічого не знайдено за цим запитом
            </div>
          </div>
        </div>

        <div id="selectedLocationBadge" class="selected-badge" style="display: none;">
          <span class="selected-badge-label">Обрано:</span>
          <span id="selectedBadgeText" class="selected-badge-text"></span>
          <span id="selectedBadgeType" class="selected-badge-type"></span>
        </div>

        <!-- Ієрархічний вибір: Область → Район → Громада -->
        <div class="hierarchy-container">
          <div class="hierarchy-field">
            <select id="selectOblast" class="hierarchy-select" title="Оберіть область чи місто">
              <option value="">(Оберіть область / місто)</option>
            </select>
          </div>
          <div class="hierarchy-field">
            <select id="selectRaion" class="hierarchy-select" title="Оберіть район" disabled>
              <option value="">(Оберіть район)</option>
            </select>
          </div>
          <div class="hierarchy-field">
            <select id="selectHromada" class="hierarchy-select" title="Оберіть громаду" disabled>
              <option value="">(Оберіть громаду)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Розділ звукових сповіщень -->
      <section class="settings-group">
        <span class="group-label">Звуковий сигнал</span>
        
        <div class="checkbox-control">
          <input type="checkbox" id="chkSoundEnabled" class="form-checkbox">
          <label for="chkSoundEnabled" class="checkbox-label">Увімкнути звуковий сигнал при тривозі</label>
        </div>

        <div id="soundControls" class="sound-subcontrols disabled">
          <div class="volume-row">
            <span class="control-icon" aria-hidden="true">
              <!-- Linear Volume Icon -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </span>
            <input type="range" id="volumeSlider" class="form-range" min="0" max="100" value="80" disabled>
            <span id="volumeValue" class="volume-val">80%</span>
          </div>

          <div class="test-audio-row">
            <button type="button" id="btnPlayTest" class="btn-secondary btn-test-audio" disabled>
              <span id="playIcon" class="btn-icon-inner">
                <!-- Linear Play Icon -->
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
              </span>
              <span id="playText">Перевірити звук</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Розділ системи -->
      <section class="settings-group">
        <span class="group-label">Система</span>
        <div class="checkbox-control">
          <input type="checkbox" id="chkAutoStart" class="form-checkbox">
          <label for="chkAutoStart" class="checkbox-label">Запускати при старті системи</label>
        </div>
      </section>

      <!-- Розділ сервера та ретранслятора -->
      <section class="settings-group">
        <span class="group-label">Сервер та API</span>
        <div class="form-field">
          <label for="inputServerUrl" class="field-label">URL сервера або ретранслятора</label>
          <input type="url" id="inputServerUrl" class="form-input" placeholder="https://devs.alerts.in.ua/api/v1/alerts/active.json">
        </div>
        <div class="form-field">
          <label for="inputApiKey" class="field-label">API ключ (опціонально)</label>
          <input type="password" id="inputApiKey" class="form-input" placeholder="Ключ для devs.alerts.in.ua">
        </div>
      </section>
    </main>

    <footer class="settings-footer">
      <button type="button" id="btnCancel" class="btn-secondary">Скасувати</button>
      <button type="button" id="btnSave" class="btn-primary">Зберегти</button>
    </footer>
  </div>

  <audio id="audioTest" src="../../../assets/audio/alert.wav" preload="auto"></audio>

  <script src="settings.js"></script>
</body>
</html>
