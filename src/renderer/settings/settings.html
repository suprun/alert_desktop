<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Налаштування — Повітряні тривоги</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1 class="settings-title">Налаштування</h1>
      <p class="settings-subtitle">Параметри моніторингу та сповіщень про тривоги</p>
    </header>

    <main class="settings-body">
      <!-- Розділ вибору місцевості -->
      <section class="settings-group">
        <label for="selectOblast" class="group-label">Місцевість для моніторингу</label>
        <!-- Блок відображення поточної обраної локації -->
        <div id="selectedLocationBadge" class="selected-badge" style="display: none;">
          <span class="selected-badge-pin" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </span>
          <span class="selected-badge-label">Обрано:</span>
          <span id="selectedBadgeText" class="selected-badge-text"></span>
          <span id="selectedBadgeType" class="location-item-type selected-badge-type"></span>
        </div>

        <!-- Ієрархічний вибір: Область → Район → Громада -->
        <div class="hierarchy-container">
          <div class="hierarchy-field">
            <select id="selectOblast" class="form-select hierarchy-select" title="Оберіть область чи місто">
              <option value="">(Оберіть область / місто)</option>
            </select>
          </div>
          <div class="hierarchy-field">
            <select id="selectRaion" class="form-select hierarchy-select" title="Оберіть район" disabled>
              <option value="">(Оберіть район)</option>
            </select>
          </div>
          <div class="hierarchy-field">
            <select id="selectHromada" class="form-select hierarchy-select" title="Оберіть громаду" disabled>
              <option value="">(Оберіть громаду)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Розділ звукових сповіщень -->
      <section class="settings-group">
        <span class="group-label">Звукові сповіщення</span>
        
        <!-- Сигнал початку тривоги -->
        <div class="sound-item-group">
          <div class="checkbox-control">
            <input type="checkbox" id="chkSoundAlertEnabled" class="form-checkbox">
            <label for="chkSoundAlertEnabled" class="checkbox-label">Увімкнути сигнал початку тривоги</label>
          </div>
          <div id="alertSoundControls" class="sound-item-controls">
            <div class="sound-select-row">
              <select id="selectAlertSound" class="form-select sound-select">
                <option value="siren">Класична сирена</option>
                <option value="pulse">Електронний пульс</option>
                <option value="chime">М'який сигнал</option>
                <option value="radar">Радарний імпульс</option>
              </select>
              <button type="button" id="btnPlayAlertTest" class="btn-secondary btn-test-sound" title="Прослухати сигнал тривоги">
                <span id="playAlertIcon" class="btn-icon-inner">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                </span>
                <span id="playAlertText">Перевірити</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Сигнал відбою тривоги -->
        <div class="sound-item-group">
          <div class="checkbox-control">
            <input type="checkbox" id="chkSoundAllClearEnabled" class="form-checkbox">
            <label for="chkSoundAllClearEnabled" class="checkbox-label">Увімкнути сигнал відбою тривоги</label>
          </div>
          <div id="allClearSoundControls" class="sound-item-controls">
            <div class="sound-select-row">
              <select id="selectAllClearSound" class="form-select sound-select">
                <option value="chime">Гармонійний передзвін</option>
                <option value="bell">Подвійний дзвіночок</option>
                <option value="marimba">Висхідна марімба</option>
                <option value="gong">Спокійний гонг</option>
              </select>
              <button type="button" id="btnPlayAllClearTest" class="btn-secondary btn-test-sound" title="Прослухати сигнал відбою">
                <span id="playAllClearIcon" class="btn-icon-inner">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                </span>
                <span id="playAllClearText">Перевірити</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Регулювання гучності -->
        <div id="volumeControls" class="volume-container">
          <div class="volume-row">
            <span class="control-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </span>
            <input type="range" id="volumeSlider" class="form-range" min="0" max="100" value="80">
            <span id="volumeValue" class="volume-val">80%</span>
          </div>
        </div>
      </section>

      <!-- Розділ системи -->
      <section class="settings-group">
        <span class="group-label">Система</span>
        <div class="checkbox-control">
          <input type="checkbox" id="chkAutoStart" class="form-checkbox">
          <label for="chkAutoStart" class="checkbox-label">Запускати при старті системи</label>
        </div>
      </section>

      <!-- Опціональні налаштування для розробників -->
      <section class="settings-group dev-settings-group">
        <div class="checkbox-control">
          <input type="checkbox" id="chkDevMode" class="form-checkbox">
          <label for="chkDevMode" class="checkbox-label group-label">Налаштування джерела даних (API)</label>
        </div>
        <p class="field-hint">Виберіть джерело отримання інформації про повітряні тривоги.</p>

        <div id="devSettingsControls" class="dev-controls" style="display: none;">
          <!-- 3 Радіокнопки вибору постачальника -->
          <div class="radio-group" role="radiogroup" aria-label="Вибір постачальника API">
            <!-- 1. Вбудований сервер-шлюз -->
            <label class="radio-item" for="radioProviderGateway">
              <input type="radio" id="radioProviderGateway" name="apiProviderRadio" value="gateway" class="form-radio" checked>
              <div class="radio-content">
                <span class="radio-title">Вбудований сервер-шлюз <span class="badge-recommended">рекомендовано</span></span>
                <span class="radio-desc">Швидкі сповіщення без затримки (WebSocket 0s). Не потребує особистого токена.</span>
              </div>
            </label>

            <!-- 2. API UkraineAlarm -->
            <label class="radio-item" for="radioProviderUkraineAlarm">
              <input type="radio" id="radioProviderUkraineAlarm" name="apiProviderRadio" value="ukrainealarm" class="form-radio">
              <div class="radio-content">
                <div class="radio-title-row">
                  <span class="radio-title">API UkraineAlarm</span>
                  <a href="https://api.ukrainealarm.com/" target="_blank" class="external-api-link" title="Відкрити документацію api.ukrainealarm.com">
                    <span>api.ukrainealarm.com</span>
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                      <polyline points="15 3 21 3 21 9"/>
                      <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                  </a>
                </div>
                <span class="radio-desc">Офіційне API системи UkraineAlarm (потрібен власний токен доступу).</span>
              </div>
            </label>

            <!-- 3. API Alerts.in.ua -->
            <label class="radio-item" for="radioProviderAlertsInUa">
              <input type="radio" id="radioProviderAlertsInUa" name="apiProviderRadio" value="alertsinua" class="form-radio">
              <div class="radio-content">
                <div class="radio-title-row">
                  <span class="radio-title">API Alerts.in.ua</span>
                  <a href="https://alerts.in.ua/api" target="_blank" class="external-api-link" title="Відкрити документацію alerts.in.ua/api">
                    <span>alerts.in.ua/api</span>
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                      <polyline points="15 3 21 3 21 9"/>
                      <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                  </a>
                </div>
                <span class="radio-desc">API мапи alerts.in.ua із деталізацією загроз (потрібен власний токен доступу).</span>
              </div>
            </label>
          </div>

          <!-- Поля адреси та токена -->
          <div class="form-field" id="fieldServerUrl">
            <label for="inputServerUrl" class="field-label">URL сервера або ендпоінту API</label>
            <input type="url" id="inputServerUrl" class="form-input" placeholder="Адреса не потрібна для вбудованого шлюзу" disabled>
          </div>
          <div class="form-field" id="fieldApiKey">
            <label for="inputApiKey" class="field-label">API ключ / токен доступу</label>
            <input type="password" id="inputApiKey" class="form-input" placeholder="Токен не потрібен для вбудованого шлюзу" disabled>
          </div>
        </div>
      </section>
    </main>

    <footer class="settings-footer">
      <button type="button" id="btnCancel" class="btn-secondary">Скасувати</button>
      <button type="button" id="btnSave" class="btn-primary">Зберегти</button>
    </footer>
  </div>

  <audio id="audioTest" src="../../../assets/audio/alert.wav" preload="auto"></audio>

  <script src="settings.js"></script>
</body>
</html>
