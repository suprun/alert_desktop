<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Повітряні тривоги</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="status-section">
      <div id="statusBadge" class="status-badge safe">
        <span id="statusIcon" class="status-icon">
          <!-- Linear Shield Check Icon -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <span id="statusLocationWrapper" class="status-location-wrapper" title="Змінити місцевість (Налаштування)">
          <span id="statusLocation" class="status-location">м. Київ</span>
          <span class="location-edit-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
            </svg>
          </span>
        </span>
        <span class="status-separator">·</span>
        <span id="statusText" class="status-text">Немає тривоги</span>
      </div>
    </div>

    <div class="actions-section">
      <span id="lastUpdated" class="last-updated">Оновлено: --:--:--</span>
      <button id="btnSettings" class="btn-icon" title="Налаштування" aria-label="Налаштування">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Тонкий індикатор активності підключення до карти -->
  <div id="mapProgressBar" class="map-progress-bar active"></div>

  <!-- Область завантаження / скелетон / повідомлення про помилку -->
  <main id="mapPlaceholder" class="map-placeholder">
    <!-- Стан завантаження -->
    <div id="mapLoadingState" class="map-state-box loading">
      <div class="loader-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
            <line x1="8" y1="2" x2="8" y2="18"/>
            <line x1="16" y1="6" x2="16" y2="22"/>
          </svg>
        </div>
      </div>
      <h2 class="map-state-title">Завантаження карти...</h2>
      <p class="map-state-subtitle">Підключення до інтерактивної мапи тривог</p>
    </div>

    <!-- Стан помилки підключення -->
    <div id="mapErrorState" class="map-state-box error" style="display: none;">
      <div class="error-icon-box">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h2 class="map-state-title">Не вдалося завантажити карту</h2>
      <p id="mapErrorDescription" class="map-state-subtitle">Перевірте інтернет-з’єднання або доступність сервера alerts.in.ua</p>
      <button type="button" id="btnRetryMap" class="btn-retry-map">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>Спробувати знову</span>
      </button>
    </div>
  </main>

  <!-- Аудіо-елемент для відтворення сигналів у вікні -->
  <audio id="audioPlayer" preload="auto"></audio>

  <script src="renderer.js"></script>
</body>
</html>
